asyncapi: 2.2.0
info:
  title: MQ Adapter for REST wallet balance Service
  version: 1.0.0
  description: Пример MQ адаптера для REST-сервиса
servers:
  production:
    url: ibmmq://localhost:1414/QM1/DEV.ADMIN.SVRCONN
    protocol: mq
    description: Production Instance 1
    bindings:
      ibmmq:
        cipherSpec: ANY_TLS12
channels:
  balance/asked:
    publish:
      message:
        $ref: '#/components/messages/song'
    subscribe:
      message:
        $ref: '#/components/messages/song'

components:
  messages:
    song:
      payload:
        type: object
        properties:
          title:
            type: string
            description: Song title
          artist:
            type: string
            description: Song artist
          album:
            type: string
            description: Song album
          genre:
            type: string
            description: Primary song genre
          length:
            type: integer
            description: Track length in seconds