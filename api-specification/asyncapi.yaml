asyncapi: 3.0.0
info:
  title: MQ Adapter for REST wallet balance service
  version: 1.0.0
  description: |
    Пример MQ адаптера для REST-сервиса
    Имеем компонент в системе, который представляет собой синхронный REST сервис.
    Сервис предоставляет информацию об электро кошельке клиента.
    Нам необходимо обеспечить асинхронную работу с данным сервисом,
    для этого мы реализовали адаптер, который с работает с броекром сообщений и передает запрос в REST сервис.
servers:
  test:
    host: ibmmq://localhost:1414
    protocol: ibmmq
    pathname: /QM1/DEV.ADMIN.SVRCONN
    description: |
      Тестовый инстанс ibm mq в докере
    bindings:
      ibmmq:
        cipherSpec: ANY_TLS12
    tags:
      - name: "env:test"
        description: "это окружение для тестирования"
      - name: "env:api-first-test"
        description: "это окружение для тестирования API"
    externalDocs:
      description: |
        IBM MQ смысла использовать нет. Мы перейдем на более легковесное Open Source решение
        Сведий контейнер переехал в репозиторий IBM https://developer.ibm.com/tutorials/mq-connect-app-queue-manager-containers/
      url: "https://hub.docker.com/r/ibmcom/mq"
channels:
  incomingMessages:
    address: "IN.QUEUE.PS"
    description: канал используется для вычитывания входящих сообщений из очереди "запросов"
    messages:
      httpRequestEnvelope:
        $ref: '#/components/messages/httpRequestEnvelope'
  receiptReceived:
    address: "RECEIPT.QUEUE.PS"
    description: канал используется для доставки квитанции об успешном получении запроса и начале обработке запроса
    messages:
      receiptValidationAcceptance:
        $ref: '#/components/messages/receiptValidationAcceptance'
  transactionReceipt:
    address: "RECEIPT.QUEUE.PS"
    description: канал используется для доставки квитанции о транзакции
    messages:
      transactionReceipt:
        $ref: '#/components/messages/transactionReceipt'
  sendRestResponse:
    address: "OUT.QUEUE.PS"
    description: канал используется для доставки ответа от REST сервиса
    messages:
      httpResponseEnvelope:
        $ref: '#/components/messages/httpResponseEnvelope'
operations:
  receiveEnvelope:
    action: receive
    channel:
      $ref: "#/channels/incomingMessages"
    summary: |
      :Получает конверт с запросом
  sendAcceptedReceipt:
    action: send
    channel:
      $ref: "#/channels/receiptReceived"
  sendTransactionReceipt:
    action: send
    channel:
      $ref: "#/channels/transactionReceipt"
  sendRestResponse:
    action: send
    channel:
      $ref: "#/channels/sendRestResponse"

components:
  messages:
    httpRequestEnvelope:
      name: httpRequestEnvelope
      title: Http Request Envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/httpEnvelopePayload'
    receiptValidationAcceptance:
      name: ReceiptValidationAcceptance
      title: Квитанция об успешном получении запроса
      contentType: application/json
      payload:
        $ref: '#/components/schemas/receiptValidationAcceptancePayload'
    transactionReceipt:
      name: TransactionReceipt
      title: Квитанция об успешном получении запроса
      contentType: application/json
      payload:
        $ref: '#/components/schemas/transactionReceiptPayload'
    httpResponseEnvelope:
      name: httpResponseEnvelope
      title: Http Response Envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/httpResponseEnvelopePayload'
  schemas:
    httpEnvelopePayload:
      type: object
      required:
        - correlationId
        - method
        - service
        - operation
        - headers
        - body
      properties:
        correlationId:
          type: string
          description: Correlation Id
        method:
          type: string
          enum:
            - GET
            - POST
          description: http метод
        service:
          type: string
          enum:
            - api-gateway
          description: конфигурация вызова в перекладчике содержит название REST сервиса
        operation:
          type: string
          enum:
            - client-wallet-balance
            - client-wallet-status
          description: |
            конфигурация вызова в перекладчике содержит название операции REST сервиса
            из двух свойств service + operation из конфига собирается
            url запроса в REST сервис
        headers:
          type: object
          properties:
            "Api-clientId":
              type: string
              description: |
                Идентификатор клиента содержится в заголовке http запроса
                Этот параметр также используется в формировании запроса в REST сервис
          required:
            - "Api-clientId"
        body:
          type: string
          description: request body
    receiptValidationAcceptancePayload:
      type: object
      required:
        - requestType
        - dateFrom
        - operTime
        - flag
      properties:
        requestType:
          type: string
          description: Тип запроса
          enum:
            - operationHistory
        dateFrom:
          type: number
          description: |
            Дата сформированного запроса 
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        operTime:
          type: number
          description: |
            Дата и время операции
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        flag:
          type: string
          description: |
            Флаг определяющий статус квитанции
          enum:
            - ACCEPTED
        dateTo:
          type: number
          description: |
            Дата и время окончания запроса
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        errorCode:
          type: number
          description: Код ошибки
        description:
          type: string
          description: Описание ошибки
    transactionReceiptPayload:
      type: object
      required:
        - requestType
        - dateFrom
        - operTime
        - flag
      properties:
        requestType:
          type: string
          description: Тип запроса
          enum:
            - operationHistory
        dateFrom:
          type: number
          description: |
            Дата сформированного запроса 
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        operTime:
          type: number
          description: |
            Дата и время операции
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        flag:
          type: string
          description: |
            Флаг определяющий статус квитанции
          enum:
            - SUCCESS
            - ERROR
        dateTo:
          type: number
          description: |
            Дата и время окончания запроса
            Java OffsetDateTime
            A date-time with an offset from UTC/Greenwich in the ISO-8601 calendar system, such as 2007-12-03T10:15:30+01:00.
        errorCode:
          type: number
          description: Код ошибки
        description:
          type: string
          description: Описание ошибки
    httpResponseEnvelopePayload:
      type: object
      required:
        - correlationId
        - status
        - message
        - method
        - service
        - operation
        - headers
        - body
      properties:
        correlationId:
          type: string
          description: Correlation Id
        status:
          type: integer
          description: httpCode
        message:
          type: string
          description: httpCode.reasonPhrase
        method:
          type: string
          enum:
            - GET
            - POST
          description: http метод
        service:
          type: string
          enum:
            - api-gateway
          description: конфигурация вызова в перекладчике содержит название REST сервиса
        operation:
          type: string
          enum:
            - client-wallet-balance
            - client-wallet-status
          description: |
            конфигурация вызова в перекладчике содержит название операции REST сервиса
            из двух свойств service + operation из конфига собирается
            url запроса в REST сервис
        headers:
          type: object
          properties:
            "Api-clientId":
              type: string
              description: |
                Идентификатор клиента содержится в заголовке http запроса
                Этот параметр также используется в формировании запроса в REST сервис
          required:
            - "Api-clientId"
        body:
          type: string
          description: request body