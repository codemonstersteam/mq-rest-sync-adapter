services:
  # IBM MQ Service
  ibmmq:
    image: ibmcom/mq:9.2.4.0-r1-amd64
    hostname: ibmmq  # Важно для корректной работы MQ!
    container_name: ibmmq
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_DEV=true
      - MQ_ADMIN_PASSWORD=passw0rd
      - MQ_APP_PASSWORD=passw0rd
      - MQ_CHANNEL=DEV.APP.SVRCONN  # Канал по умолчанию
    networks:
      - test-network
    volumes:
      - ./scripts/mqsc/20-config.mqsc:/etc/mqm/20-config.mqsc:Z
    healthcheck:
      test: ["CMD-SHELL", "chkmqhealthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WireMock REST API Stub
  wiremock:
    image: wiremock/wiremock:3.13.0
    container_name: wiremock
    hostname: wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: 
      - --global-response-templating
      - --verbose
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL для Unleash
  unleash-db:
    image: postgres:15-alpine
    container_name: unleash-db
    hostname: unleash-db
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash
      - POSTGRES_PASSWORD=unleash_password
    # volumes:
    #   - unleash_db_data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Unleash Server
  unleash:
    image: unleashorg/unleash-server:7.0
    container_name: unleash
    hostname: unleash
    ports:
      - "4242:4242"
    environment:
      - DATABASE_HOST=unleash-db
      - DATABASE_NAME=unleash
      - DATABASE_USERNAME=unleash
      - DATABASE_PASSWORD=unleash_password
      - DATABASE_SSL=false
      - LOG_LEVEL=info
      - INIT_FRONTEND_API_TOKENS=default:development.unleash-insecure-frontend-api-token
      - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
      - UNLEASH_URL=http://localhost:4242
      - DATABASE_URL=postgres://unleash:unleash_password@unleash-db:5432/unleash
      - INIT_ADMIN_USERNAME=admin
      - INIT_ADMIN_PASSWORD=unleash4all
    networks:
      - test-network
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Тестовый контейнер (если запускаете тесты как отдельный сервис)
  test-runner:
    image: codemonstersteam/jdk21-deps:0.0.4
    container_name: test-runner
    # user: "988:986"
    environment:
      - MQ_HOST=ibmmq
      - MQ_PORT=1414
      - MQ_QMGR_NAME=QM1
      - MQ_CHANNEL=DEV.APP.SVRCONN
      - MQ_USER=app
      - MQ_PASSWORD=passw0rd
      - WIREMOCK_HOST=wiremock
      - WIREMOCK_PORT=8080
      - UNLEASH_HOST=unleash
      - UNLEASH_PORT=4242
      - UNLEASH_API_TOKEN=default:development.unleash-insecure-api-token
      - UNLEASH_ADMIN_API_TOKEN=*:*.development.unleash-insecure-admin-api-token

    volumes:
      - ./:/home/gitlab-runner/project:Z
    working_dir: /home/gitlab-runner/project
    command: |
      bash -c '
        echo "log of test-runner"
        id
        ls -la
        echo "pwd > $(pwd)"
        ./gradlew cucumber -Dcucumber.filter.tags="@test-stubs"
        chmod -R 777 ./build
        chown -R 988:986 ./build
        chmod -R 777 .gradle
        chown -R 988:986 .gradle
      '
    networks:
      - test-network
    depends_on:
      ibmmq:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      unleash:
        condition: service_healthy

# MQ-REST-Sync-Adapter Service
volumes:
  unleash_db_data:

networks:
  test-network:
    driver: bridge