stages:
  - test-api-specification
  - unit-tests
  - component-tests

test-api-specification:
  image:
    name: asyncapi/cli:3.5.2
    entrypoint: ['']
  stage: test-api-specification
  script:
    - asyncapi validate ./api-specification/asyncapi.yml

unit-tests:
  tags:
    - compose
  stage: unit-tests
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  needs:
    - test-api-specification
  script:
    - export USER_ID=$(id -u)
    - export GROUP_ID=$(id -g)
    - docker compose --profile build up
    - ls -la build/
  artifacts:
    paths:
      - build/
    expire_in: 5 day

component-tests:
  tags:
    - compose
  stage: component-tests
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  needs:
    - unit-tests
  script:
    - cd component-tests
    # скрипт отвечает за проверку с тоглами, если таковые есть
    # за счет интеграции с unleash
    - ./scripts/run-test-sut-v2.sh
  artifacts:
    paths:
      - component-tests/build/
    expire_in: 5 day