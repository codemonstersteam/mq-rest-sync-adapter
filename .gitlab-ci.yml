# DinD service is required for Testcontainers
services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

stages:
  - test-api-specification
  - unit-tests
  - component-tests

unit-tests:
  image: gradle:jdk21
  stage: unit-tests
  script:
    - ./gradlew test

test-api-specification:
  image:
    name: asyncapi/cli:3.1.1
    entrypoint: ['']
  stage: test-api-specification
  script:
    - asyncapi validate ./api-specification/asyncapi.yml

component-tests:
  tags:
    - compose
  stage: component-tests
  script:
    - export FT_ENABLED=true
    - cd component-tests
    - ./scripts/run-test-sut-v2.sh