services:
  # Сервис для сборки
  builder:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    user: $USER_ID:$GROUP_ID
    volumes:
      - .:/app
      - gradle-cache:/home/runner/.gradle
    command: | 
        bash -c '
          whoami
          pwd
          ls -la
          ls -la /home/runner
          ./gradlew build
          chmod -R 777 ./build
          chown -R $(id -u):$(id -g) ./build
          chmod -R 777 .gradle
          chown -R $(id -u):$(id -g) .gradle
        '
    profiles: 
      - build

  # Сервис для запуска приложения
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms64m -Xmx256m
    profiles:
      - run

volumes:
  gradle-cache:
